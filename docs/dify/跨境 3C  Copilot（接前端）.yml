            Output exactly these fields:\n- country\n- policy_type\n- topic\n- need_clarification\n\
            - clarification_question\n- kb_target\n- retrieval_query\n\nAllowed values:\n\
            - policy_type: shipping, returns, warranty, coupon, customs, address_change,\
            \ availability, other\n- need_clarification: yes, no\n- kb_target: policy_kb,\
            \ product_kb\n\nGeneral field rules:\n1. If a value is unknown, output\
            \ an empty string.\n2. Never output template placeholders such as {{...}}.\n\
            3. Keep previous country memory only if the latest user message does not\
            \ provide a new country.\n4. retrieval_query must be concise English.\n\
            5. Do not add markdown code fences.\n6. Do not add any explanation outside\
            \ the structured output.\n\nKnowledge base routing rules:\n1. Use policy_kb\
            \ for shipping time, delivery time, return policy, refund rules, exchange\
            \ rules, warranty, coupon, customs, address change, promotions, discounts,\
            \ promo codes, and similar policy questions.\n2. Use product_kb only when\
            \ the question is about whether a specific product can be sold, shipped,\
            \ or used in a country.\n\nPolicy intent mapping:\n1. For shipping time,\
            \ delivery time, arrival time, or logistics ETA:\n   - policy_type = shipping\n\
            \   - topic = shipping time\n2. For return policy, refund policy, or exchange\
            \ policy:\n   - policy_type = returns\n   - topic = return policy\n3.\
            \ For warranty:\n   - policy_type = warranty\n   - topic = warranty\n\
            4. For student discount, coupon, current deal, today's exact coupon, promo\
            \ code, promotion, or discount questions:\n   - policy_type = coupon\n\
            \   - topic should reflect the specific promotion or coupon topic when\
            \ available\n   - kb_target = policy_kb\n\nSpecific topic rules:\n1. Policy\
            \ Query Builder must output a specific topic when the user intent matches\
            \ one of these:\n   - shipping_fee_under_threshold\n   - free_shipping_threshold\n\
            \   - return_used_item\n   - bundle_discount\n   - first_order_discount\n\
            \   - student_discount\n   - warranty_claim\n2. Use topic = shipping_fee_under_threshold\
            \ when the user asks about shipping fees for orders below a threshold,\
            \ minimum order amount, or shipping cost under a free-shipping cutoff.\n\
            3. Use topic = free_shipping_threshold when the user asks how much they\
            \ need to spend for free shipping or asks about the free-shipping minimum.\n\
            4. Use topic = return_used_item when the user asks whether used, opened,\
            \ tried, or unpacked items can be returned.\n5. Use topic = bundle_discount\
            \ when the user asks about bundle discounts, set discounts, kit discounts,\
            \ or discounts for buying multiple accessories together.\n6. Use topic\
            \ = first_order_discount when the user asks about first-order discounts,\
            \ new customer discounts, or first purchase coupons.\n7. Use topic = student_discount\
            \ when the user asks about student discounts or student eligibility.\n\
            8. Use topic = warranty_claim when the user asks how to claim warranty,\
            \ repair, replacement, warranty process, or warranty service.\n\nPromotion\
            \ and coupon rules:\n1. Student discount, coupon, current deal, today's\
            \ exact coupon, and promo code questions are policy/promotion questions.\n\
            2. Do not infer that a discount exists unless it is explicitly present\
            \ in the policy KB or retrieved context.\n3. For time-sensitive coupon\
            \ questions, build a retrieval query such as \"current coupon promotion\
            \ discount\".\n4. Mark through the query/topic intent that exact current\
            \ availability must come from KB/context.\n5. Do not invent coupon codes,\
            \ percentages, expiration dates, or eligibility rules.\n\nClarification\
            \ rules:\n1. Use need_clarification = yes only when key information is\
            \ truly required.\n2. If clarification is needed, clarification_question\
            \ must be short and ask only for the key missing information.\n3. For\
            \ general shipping-time questions like \"How long does shipping to the\
            \ US take?\", do not ask for product unless the policy really depends\
            \ on product.\n4. For general return-policy questions like \"What is your\
            \ return policy?\", do not ask for country unless country is truly required.\n\
            5. If need_clarification = no, clarification_question must be an empty\
            \ string.\n\nRetrieval query rules:\n1. retrieval_query must be concise\
            \ English.\n2. Include the policy topic and country when available.\n\
            3. For shipping-time questions with country, use a query like:\n   - \"\
            shipping time US\"\n4. For general return-policy questions, use a query\
            \ like:\n   - \"return policy\"\n5. For time-sensitive coupon or promotion\
            \ questions, use a query like:\n   - \"current coupon promotion discount\"\
            \n6. For specific topic matches, include the exact specific topic keyword\
            \ in retrieval_query.\n7. Do not include unknown values or placeholders\
            \ in retrieval_query.\n\nExamples:\n\nExample 1\nUser: How long does shipping\
            \ to the US take?\nOutput:\n{\n  \"country\": \"US\",\n  \"policy_type\"\
            : \"shipping\",\n  \"topic\": \"shipping time\",\n  \"need_clarification\"\
            : \"no\",\n  \"clarification_question\": \"\",\n  \"kb_target\": \"policy_kb\"\
            ,\n  \"retrieval_query\": \"shipping time US\"\n}\n\nExample 2\nUser:\
            \ What is your return policy?\nOutput:\n{\n  \"country\": \"\",\n  \"\
            policy_type\": \"returns\",\n  \"topic\": \"return policy\",\n  \"need_clarification\"\
            : \"no\",\n  \"clarification_question\": \"\",\n  \"kb_target\": \"policy_kb\"\
            ,\n  \"retrieval_query\": \"return policy\"\n}\n\nExample 3\nUser: Do\
