        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 'Hi, I can help you choose the right 3C accessory, check compatibility,
      answer shipping or return questions, and flag cases that need human support.

      '
