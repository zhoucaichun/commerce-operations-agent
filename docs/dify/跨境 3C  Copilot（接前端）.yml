            \ is safety/medical/high-power or another required field is truly necessary.\n\
            5. If category_preference or usage_scenario is clear, info_sufficient\
            \ should usually be \"yes\" even when device_model is missing.\n6. If\
            \ both budget_text and usage_scenario are missing but the latest user\
            \ message has a strong recommendation signal, do not automatically ask\
            \ a follow-up.\n7. Use info_sufficient = \"no\" only when there is no\
            \ usable product category, no device, no usage scenario, no budget, and\
            \ no recommendation intent.\n8. If info_sufficient is \"yes\":\n   - missing_fields\
            \ must be []\n   - followup_question must be \"\"\n9. If info_sufficient\
            \ is \"no\":\n   - ask only one short natural follow-up question\n   -\
            \ ask for the most important missing field only\n   - missing_fields should\
            \ contain only truly important missing fields\n10. followup_question must\
            \ be short, natural, user-facing, and ask only for the most important\
            \ missing information.\n11. Do not set info_sufficient = \"no\" only because\
            \ the user did not provide budget.\n12. Do not set info_sufficient = \"\
            no\" only because the user did not provide country.\n13. Do not set info_sufficient\
            \ = \"no\" only because the user did not choose a subcategory when the\
            \ query already implies a reasonable starter set.\n\nRetrieval query rules:\n\
            1. retrieval_query must be concise English and reflect the fully merged\
