    - data:
        classes:
        - id: '1'
          name: recommendation：用户希望被推荐商品
        - id: '2'
          name: compatibility：用户问某产品是否适配
        - id: '1775812125087'
          name: policy：物流、退换、保修、优惠等规则
        - id: '1775812130923'
          name: ' high_risk：破损、错发、投诉、订单异常'
        - id: '1775812137996'
          name: other：无法归类或需继续澄清
        instruction: "Classify the latest user message into exactly one category.\n\
          \nAvailable categories:\n- recommendation\n- compatibility\n- policy\n-\
          \ high_risk\n- other\n\nYou MUST classify based on the latest user message.\n\
          You MAY use conversation state, such as last_intent, pending_field, or the\
          \ previous assistant follow-up question, only to disambiguate short replies.\n\
          \nFollow-up reply rule / anti-reset:\n1. If the latest user message looks\
          \ like a short answer to the assistant's previous follow-up question, then\
          \ do NOT classify it as other and do NOT classify it as high_risk unless\
          \ it explicitly contains high-risk or dispute-related content.\n2. Short\
          \ follow-up answers include, but are not limited to:\n   - a country name,\
          \ such as \"usa\", \"US\", \"United States\", \"Canada\", or \"UK\"\n  \
          \ - a pure budget, such as \"$25\", \"under 25\", or \"under $25\"\n   -\
          \ a device, such as \"iPhone 15\"\n   - a single word or short phrase answering\
          \ a slot, such as \"for travel\", \"yes\", or \"daily use\"\n3. If the latest\
          \ user message is only a short answer to the previous assistant follow-up,\
          \ keep the same class as the previous turn whenever available.\n4. Route\
          \ short follow-up replies to the most likely previous intent:\n   - If last_intent\
          \ is \"recommendation\", classify as recommendation.\n   - If last_intent\
          \ is \"compatibility\", classify as compatibility.\n   - If last_intent\
          \ is \"policy\", classify as policy.\n   - Otherwise classify as recommendation.\n\
          \nCategory rules:\n1. Classify as recommendation when the user asks for\
          \ product recommendations, purchase choices, comparisons, \"which is better\"\
          \ questions, or phrases such as \"what should I buy\", \"recommend\", \"\
          best\", \"cheapest\", \"setup\", or \"bundle\".\n2. Classify comparison\
          \ or \"which is better\" questions as recommendation.\n3. Classify as compatibility\
          \ when the user asks \"Will this work with my X\", or asks about compatibility,\
          \ wattage, connector fit, device fit, whether a product works with a device,\
          \ whether a product can charge a device, whether a product can be used with\
          \ a device, or whether one accessory can work across multiple devices.\n\
          4. Classify \"work with\", \"compatible\", \"fit\", \"charge\", or \"use\
          \ with\" questions as compatibility.\n5. If the user asks for one cable,\
          \ one charger, or one accessory for two known devices, classify as compatibility\
          \ first.\n6. Multi-device shared cable / charger questions should route\
          \ to compatibility first.\n7. Queries such as \"one cable for MacBook and\
          \ iPhone 15\" are not broad recommendation by default.\n8. Multi-device\
          \ shared-fit questions should route to compatibility unless the user explicitly\
          \ asks for product suggestions only.\n9. Examples that should route to compatibility:\n\
          \   - \"I need one cable for MacBook and iPhone 15\"\n   - \"Can I charge\
          \ MacBook Pro 14 and iPhone at the same time with 65W charger?\"\n10. Classify\
          \ as policy when the user asks about shipping, return, refund, warranty,\
          \ coupon, discount, or country availability.\n11. Classify as high_risk\
          \ when the user mentions damaged item, wrong item, missing item, angry complaint,\
          \ safety-critical issues, absolute guarantee requests, medical scenarios,\
          \ baby scenarios, or dispute-related order issues.\n12. Classify as high_risk\
          \ when the user mentions damaged, burned, delivered but missing, hospital,\
          \ baby, or safety guarantee.\n13. Use other only when the user message is\
          \ truly not actionable and is not a follow-up reply under the anti-reset\
          \ rule.\n\nHigh-risk triggers:\nClassify as high_risk when the user mentions\
          \ any of the following:\n- fire, burned, smoke, explosion\n- electric shock,\
          \ injury, unsafe, dangerous\n- damaged item, wrong item, or missing item\n\
          - baby room safety guarantee\n- hospital equipment or medical equipment\n\
          - legal complaint, lawsuit, compensation demand\n- delivered but not received,\
          \ delivered but missing, lost package, or stolen package when it involves\
          \ an order dispute or complaint\n\nSafety routing rule:\nHigh-risk or dispute-related\
          \ messages should not be routed directly to normal recommendation or compatibility\
          \ answers.\nIf the broader system has an after_sales_handoff route, high-risk\
          \ after-sales or dispute messages may be routed there; within this classifier's\
          \ allowed labels, output high_risk.\n\nOutput rule:\nReturn exactly one\
          \ category and no extra text."
