            policy_type\": \"coupon\",\n  \"topic\": \"student_discount\",\n  \"need_clarification\"\
            : \"no\",\n  \"clarification_question\": \"\",\n  \"kb_target\": \"policy_kb\"\
            ,\n  \"retrieval_query\": \"student_discount current coupon promotion\
            \ discount\"\n}\n\nExample 4\nUser: Can I return an opened charger?\n\
            Output:\n{\n  \"country\": \"\",\n  \"policy_type\": \"returns\",\n  \"\
