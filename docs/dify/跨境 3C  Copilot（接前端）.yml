    - data:
        code: "import re\nfrom typing import Any, Dict, List, Optional\n\n\ndef norm(v:\
          \ Any) -> str:\n    return \"\" if v is None else str(v).strip()\n\n\ndef\
          \ truthy(v: Any) -> bool:\n    return norm(v).lower() in {\"true\", \"1\"\
          , \"yes\", \"y\"}\n\n\ndef to_float(v: Any) -> Optional[float]:\n    text\
          \ = norm(v)\n    if not text:\n        return None\n    match = re.search(r\"\
          (\\d+(?:\\.\\d+)?)\", text)\n    return float(match.group(1)) if match else\
          \ None\n\n\ndef split_tokens(text: str) -> List[str]:\n    return [t for\
          \ t in re.split(r\"[^a-z0-9]+\", norm(text).lower()) if t]\n\n\ndef parse_record(content:\
          \ str) -> Dict[str, str]:\n    record: Dict[str, str] = {}\n    for part\
          \ in [p.strip() for p in norm(content).split(\";\") if p.strip()]:\n   \
          \     if \":\" not in part:\n            continue\n        key, value =\
          \ part.split(\":\", 1)\n        record[key.strip().lower()] = value.strip()\n\
          \    return record\n\n\ndef is_broad_charging_request(request: Dict[str,\
          \ str]) -> bool:\n    text = \" \".join([\n        request[\"category_preference\"\
          ],\n        request[\"retrieval_query\"],\n        request[\"usage_scenario\"\
          ],\n    ]).lower()\n\n    broad_terms = [\n        \"charging accessories\"\
          ,\n        \"charging setup\",\n        \"accessories\",\n        \"setup\"\
          ,\n        \"bundle\",\n    ]\n    charging_terms = [\"charger\", \"charging\"\
          , \"cable\", \"power bank\", \"usb-c\"]\n\n    return any(t in text for\
          \ t in broad_terms) and any(t in text for t in charging_terms) and not request[\"\
          device_model\"]\n\n\ndef has_high_power_signal(request: Dict[str, str])\
          \ -> bool:\n    text = \" \".join([\n        request[\"category_preference\"\
          ],\n        request[\"retrieval_query\"],\n        request[\"usage_scenario\"\
          ],\n        request[\"strong_constraint\"],\n    ]).lower()\n\n    return\
          \ any(\n        t in text\n        for t in [\n            \"laptop\",\n\
          \            \"macbook\",\n            \"multi-device\",\n            \"\
          multiple devices\",\n            \"several devices\",\n            \"office\"\
          ,\n            \"work from home\",\n            \"100w\",\n            \"\
          65w\",\n            \"high power\",\n            \"gan\",\n        ]\n \
          \   )\n\n\ndef detect_locked_attribute(category_preference: str, strong_constraint:\
          \ str, retrieval_query: str) -> str:\n    category = norm(category_preference).lower()\n\
          \    strong = norm(strong_constraint).lower()\n\n    explicit_text = \"\
          \ \".join([category, strong]).lower()\n\n    broad_categories = {\n    \
          \    \"charging accessories\",\n        \"accessories\",\n        \"3c accessories\"\
          ,\n        \"setup\",\n        \"charging setup\",\n        \"bundle\",\n\
          \    }\n    if category in broad_categories and not strong:\n        return\
          \ \"\"\n\n    if \"magsafe\" in explicit_text:\n        return \"magsafe\"\
          \n    if \"car charger\" in explicit_text or \"vehicle charger\" in explicit_text\
          \ or \"in-car\" in explicit_text:\n        return \"car charger\"\n    if\
          \ \"power bank\" in explicit_text or \"portable charger\" in explicit_text:\n\
          \        return \"power bank\"\n    if \"hub\" in explicit_text:\n     \
          \   return \"hub\"\n    if \"stand\" in explicit_text:\n        return \"\
          stand\"\n    if \"lightning cable\" in explicit_text:\n        return \"\
          lightning cable\"\n    if \"usb-c cable\" in explicit_text or \"usb c cable\"\
          \ in explicit_text:\n        return \"usb-c cable\"\n    if \"cable\" in\
          \ explicit_text and category not in broad_categories:\n        return \"\
          cable\"\n    if \"charger\" in explicit_text and category not in broad_categories:\n\
          \        return \"charger\"\n\n    return \"\" if category in broad_categories\
          \ else category\n\n\ndef category_match_score(locked_attribute: str, category:\
          \ str, searchable_text: str) -> int:\n    locked = norm(locked_attribute).lower()\n\
          \    category_text = norm(category).lower()\n    text = norm(searchable_text).lower()\n\
          \n    if not locked:\n        return 0\n\n    if locked == \"car charger\"\
          :\n        if \"car charger\" in category_text or \"car charger\" in text\
          \ or \"vehicle charger\" in text or \"in-car\" in text:\n            return\
          \ 40\n        return -20\n\n    if locked == \"magsafe\":\n        if \"\
          magsafe\" in text:\n            return 40\n        return -15\n\n    if\
          \ locked == \"power bank\":\n        if \"power bank\" in category_text\
          \ or \"power bank\" in text or \"portable charger\" in text:\n         \
          \   return 40\n        return -20\n\n    if locked == \"lightning cable\"\
          :\n        if \"lightning\" in text and \"cable\" in category_text:\n  \
          \          return 40\n        return -20\n\n    if locked == \"usb-c cable\"\
          :\n        if (\"usb-c\" in text or \"usb c\" in text) and \"cable\" in\
          \ category_text:\n            return 40\n        return -15\n\n    if locked\
          \ and locked in category_text:\n        return 35\n    if locked and locked\
          \ in text:\n        return 25\n    return -10\n\n\ndef broad_charging_score(record:\
          \ Dict[str, str], searchable_text: str, high_power_signal: bool) -> int:\n\
          \    category = norm(record.get(\"category\")).lower()\n    product_name\
          \ = norm(record.get(\"product_name\")).lower()\n    connector = norm(record.get(\"\
          connector\")).lower()\n    aliases = norm(record.get(\"search_aliases\"\
          )).lower()\n    price = to_float(record.get(\"price_usd\"))\n    text =\
          \ \" \".join([searchable_text, product_name, connector, aliases]).lower()\n\
          \n    score = 0\n\n    if \"power bank\" in category or \"power bank\" in\
          \ text or \"portable charger\" in text:\n        score += 32\n\n    if \"\
          wall charger\" in category or \"charger\" in product_name:\n        score\
          \ += 30\n\n    if \"usb-c\" in text or \"usb c\" in text:\n        score\
          \ += 12\n\n    if \"pd\" in text or \"fast charging\" in text:\n       \
          \ score += 8\n\n    if \"cable\" in category and (\"usb-c\" in text or \"\
          usb c\" in text):\n        score += 10\n\n    # Multi-port / GaN / 100W\
          \ is useful, but should not outrank a compact\n    # affordable phone charger\
          \ in a generic charging setup unless the user\n    # signals laptop, office,\
          \ multi-device, or high-power needs.\n    if \"gan\" in text or \"multi-port\"\
          \ in text or \"triple port\" in text:\n        score += 4 if not high_power_signal\
          \ else 14\n\n    if \"100w\" in text or \"laptop\" in text or \"macbook\"\
          \ in text:\n        score += 4 if high_power_signal else -8\n\n    # For\
          \ broad charging setup, compact and affordable first is usually safer.\n\
          \    if price is not None:\n        if price <= 25:\n            score +=\
          \ 8\n        elif price >= 60 and not high_power_signal:\n            score\
          \ -= 8\n\n    # Lightning is device-specific. Do not rank it first when\
          \ device is unknown.\n    if \"lightning\" in text:\n        score -= 30\n\
          \n    return score\n\n\ndef device_match_score(device_model: str, searchable_text:\
          \ str) -> int:\n    tokens = split_tokens(device_model)\n    text = norm(searchable_text).lower()\n\
          \    if not tokens:\n        return 0\n\n    if \"iphone 15\" in norm(device_model).lower()\
          \ and \"lightning\" in text:\n        return -30\n\n    if all(t in text\
          \ for t in tokens):\n        return 20\n    if any(t in text for t in tokens):\n\
          \        return 10\n    return -5\n\n\ndef usage_match_score(usage_scenario:\
          \ str, searchable_text: str) -> int:\n    tokens = split_tokens(usage_scenario)\n\
          \    text = norm(searchable_text).lower()\n    if not tokens:\n        return\
          \ 0\n    return 6 if any(t in text for t in tokens) else 0\n\n\ndef country_match(country:\
          \ str, country_available: str) -> bool:\n    country_text = norm(country).upper()\n\
          \    available = [x.strip().upper() for x in norm(country_available).split(\"\
          |\") if x.strip()]\n    alias_map = {\n        \"CHINA\": {\"CN\", \"CHINA\"\
          },\n        \"UNITED STATES\": {\"US\", \"USA\", \"UNITED STATES\"},\n \
          \       \"USA\": {\"US\", \"USA\", \"UNITED STATES\"},\n        \"UNITED\
          \ KINGDOM\": {\"UK\", \"UNITED KINGDOM\", \"GB\"},\n    }\n    if not country_text:\n\
          \        return False\n    wanted = alias_map.get(country_text, {country_text})\n\
          \    return any(code in wanted for code in available)\n\n\ndef build_candidate(item:\
          \ Dict[str, Any], request: Dict[str, Any], locked_attribute: str, broad_charging:\
          \ bool, high_power_signal: bool) -> Optional[Dict[str, Any]]:\n    record\
          \ = parse_record(item.get(\"content\", \"\"))\n    if not record:\n    \
          \    return None\n\n    sku = norm(record.get(\"sku_id\") or record.get(\"\
          sku\"))\n    product_name = norm(record.get(\"product_name\"))\n    category\
          \ = norm(record.get(\"category\"))\n    price_usd = to_float(record.get(\"\
          price_usd\"))\n    country_available = norm(record.get(\"country_available\"\
          ))\n    limitations = norm(record.get(\"limitations\"))\n\n    searchable_text\
          \ = \" \".join(\n        [\n            norm(item.get(\"content\")),\n \
          \           product_name,\n            category,\n            norm(record.get(\"\
          device_compatibility\")),\n            norm(record.get(\"usage_scenario\"\
          )),\n            norm(record.get(\"search_aliases\")),\n            norm(record.get(\"\
          key_features\")),\n            norm(record.get(\"connector\")),\n      \
          \  ]\n    ).lower()\n\n    score = 0\n    score += category_match_score(locked_attribute,\
          \ category, searchable_text)\n    score += device_match_score(request[\"\
          device_model\"], searchable_text)\n    score += usage_match_score(request[\"\
          usage_scenario\"], searchable_text)\n\n    if broad_charging:\n        score\
          \ += broad_charging_score(record, searchable_text, high_power_signal)\n\n\
          \    budget = to_float(request[\"budget_text\"])\n    budget_ok = True\n\
          \    if budget is not None and price_usd is not None:\n        if price_usd\
          \ <= budget:\n            score += 12\n        else:\n            score\
          \ -= 25\n            budget_ok = False\n\n    country_ok = country_match(request[\"\
          country\"], country_available)\n    if request[\"country\"]:\n        score\
          \ += 4 if country_ok else -1\n\n    return {\n        \"sku\": sku,\n  \
          \      \"product_name\": product_name,\n        \"category\": category,\n\
          \        \"price_usd\": price_usd,\n        \"country_available\": country_available,\n\
          \        \"limitations\": limitations,\n        \"score\": score,\n    \
          \    \"budget_ok\": budget_ok,\n        \"country_ok\": country_ok,\n  \
          \      \"locked_attribute\": locked_attribute,\n    }\n\n\ndef main(\n \
          \   retrieval_results: Any,\n    device_model: Any,\n    category_preference:\
          \ Any,\n    budget_text: Any,\n    usage_scenario: Any,\n    retrieval_query:\
          \ Any,\n    country: Any,\n    strong_constraint: Any,\n    must_return_single_pick:\
          \ Any,\n) -> Dict[str, Any]:\n    request = {\n        \"device_model\"\
          : norm(device_model),\n        \"category_preference\": norm(category_preference),\n\
          \        \"budget_text\": norm(budget_text),\n        \"usage_scenario\"\
          : norm(usage_scenario),\n        \"retrieval_query\": norm(retrieval_query),\n\
          \        \"country\": norm(country),\n        \"strong_constraint\": norm(strong_constraint),\n\
          \    }\n\n    broad_charging = is_broad_charging_request(request)\n    high_power_signal\
          \ = has_high_power_signal(request)\n\n    locked_attribute = detect_locked_attribute(\n\
          \        request[\"category_preference\"],\n        request[\"strong_constraint\"\
          ],\n        request[\"retrieval_query\"],\n    )\n\n    items = retrieval_results\
          \ if isinstance(retrieval_results, list) else []\n    candidates: List[Dict[str,\
          \ Any]] = []\n\n    for item in items:\n        if not isinstance(item,\
          \ dict):\n            continue\n        candidate = build_candidate(item,\
          \ request, locked_attribute, broad_charging, high_power_signal)\n      \
          \  if candidate and (candidate[\"sku\"] or candidate[\"product_name\"]):\n\
          \            candidates.append(candidate)\n\n    prefer_cheapest = (\n \
          \       \"cheapest\" in request[\"strong_constraint\"].lower()\n       \
          \ or \"lowest price\" in request[\"retrieval_query\"].lower()\n    )\n\n\
          \    if prefer_cheapest:\n        candidates.sort(\n            key=lambda\
          \ x: (\n                0 if x[\"budget_ok\"] else 1,\n                x[\"\
          price_usd\"] if x[\"price_usd\"] is not None else 10**9,\n             \
          \   -x[\"score\"],\n            )\n        )\n    else:\n        candidates.sort(\n\
          \            key=lambda x: (\n                -x[\"score\"],\n         \
          \       0 if x[\"budget_ok\"] else 1,\n                x[\"price_usd\"]\
          \ if x[\"price_usd\"] is not None else 10**9,\n            )\n        )\n\
          \n    candidate_count = len(candidates)\n    best = candidates[0] if candidates\
          \ else {}\n    best_sku = best.get(\"sku\", \"\")\n    return_single_pick\
          \ = \"true\" if truthy(must_return_single_pick) or prefer_cheapest else\
          \ \"false\"\n\n    any_country_match = any(c[\"country_ok\"] for c in candidates)\
          \ if request[\"country\"] else False\n    country_filter_relaxed = \"true\"\
          \ if candidate_count > 0 and request[\"country\"] and not any_country_match\
          \ else \"false\"\n\n    sorted_candidates_json = candidates[:10]\n    sorted_candidates_text\
          \ = \"\\n\".join(\n        [\n            f\"- {c['sku']} | {c['product_name']}\
          \ (${c['price_usd'] if c['price_usd'] is not None else 'NA'}) | \"\n   \
          \         f\"category={c['category']} | country_available={c['country_available']}\
          \ | limitations={c['limitations'] or 'none'}\"\n            for c in sorted_candidates_json\n\
          \        ]\n    )\n\n    return {\n        \"sorted_candidates_text\": sorted_candidates_text,\n\
          \        \"sorted_candidates_json\": sorted_candidates_json,\n        \"\
          candidate_count\": candidate_count,\n        \"best_sku\": best_sku,\n \
          \       \"return_single_pick\": return_single_pick,\n        \"locked_attribute\"\
          : locked_attribute,\n        \"country_filter_relaxed\": country_filter_relaxed,\n\
          \    }"
