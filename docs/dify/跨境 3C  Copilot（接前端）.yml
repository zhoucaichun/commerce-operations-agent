app:
  description: '本项目希望通过 Dify 搭建一个可演示的 AI 售前导购系统，实现：

    1. 商品推荐

    2. 兼容性问答

    3. 政策规则答复

    4. 高风险识别与转人工'
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 跨境 3C  Copilot（接前端）
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/gemini:0.9.10@4979b8843fa46c3c2143d339f5868f04d9d77166616c00dd9f811a4adfce03ab
    version: null
- current_identifier: null
  type: marketplace
  value:
