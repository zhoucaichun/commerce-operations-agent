    - data:
        code: "import re\n\ndef main(budget: str): # 确保这里的参数名叫 budget\n    # 1. 预处理：去掉美元符号\
          \ $、逗号以及空格\n    clean_str = budget.replace('$', '').replace(',', '').strip()\n\
          \    \n    # 2. 提取数字部分\n    numbers = re.findall(r'\\d+\\.?\\d*', clean_str)\n\
          \    \n    if not numbers:\n        return {\n            \"min_budget\"\
          : 0, \n            \"max_budget\": 0, \n            \"has_value\": False\n\
          \        }\n    \n    # 3. 转换为浮点数\n    num_list = [float(n) for n in numbers]\n\
          \    \n    return {\n        \"min_budget\": min(num_list),\n        \"\
          max_budget\": max(num_list),\n        \"has_value\": True\n    }"
