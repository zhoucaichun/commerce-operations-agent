            5. When the catalog may describe compatibility in a broad range, retrieval_query\
            \ should still include the exact user device literal.\n6. retrieval_query\
            \ should prefer catalog keywords such as:\n   - category: \"Wall Charger\"\
            \n   - connector: \"USB-C\"\n   - power_watt: \"20W\" or \"30W\"\n   -\
            \ device: \"iPhone 15\"\n   - budget: \"under 25\"\n7. For broad charging-accessory\
            \ questions, use:\n   - \"charging accessories charger cable power bank\
            \ USB-C Lightning fast charging\"\n8. Do not include unsupported details\
            \ in retrieval_query.\n9. If the user asks for cheapest or gives a hard\
            \ budget, preserve that constraint with wording like \"cheapest\" or \"\
            under $25\".\n10. If budget_text exists, include the exact budget wording.\n\
            11. If the user explicitly indicates no budget limit, include that preference\
            \ only when useful and do not invent a budget.\n12. Do not add product\
            \ names, SKU IDs, prices, countries, or device variants that are not present\
            \ in user message, form fields, or memory.\n13. Include locked strong\
